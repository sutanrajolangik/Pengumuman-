<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PKD Cyber Command // Next-Gen Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-deep: #010409;
            --surface: #0d1117;
            --surface-hover: #161b22;
            --primary: #38bdf8; /* Neon Sky Blue */
            --secondary: #34d399; /* Neon Emerald */
            --accent: #fbbf24; /* Cyber Gold */
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border-glow: rgba(56, 189, 248, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Latar Belakang Efek Hologram Scanline */
        .cyber-grid {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(56, 189, 248, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
        }

        /* Garis Laser Berjalan */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* Kotak Login Terbaru */
        .login-card {
            background: rgba(13, 17, 23, 0.85);
            border: 1px solid var(--border-glow);
            backdrop-filter: blur(25px);
            border-radius: 24px;
            padding: 50px 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.95), 0 0 40px rgba(56, 189, 248, 0.15);
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        /* Sudut Teknologi Kosmik */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 70px; height: 70px;
            background: linear-gradient(135deg, transparent 50%, var(--primary) 50%);
            opacity: 0.5;
        }

        .avatar-robot {
            width: 80px;
            height: 80px;
            background: rgba(56, 189, 248, 0.1);
            border: 2px solid var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
            animation: floatRobot 3s ease-in-out infinite;
            overflow: hidden;
        }

        /* Styling untuk logo gambar di dalam lingkaran */
        .avatar-robot img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 10px; /* Atur jarak jika logo terlalu besar/menempel tepi */
        }

        @keyframes floatRobot {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .system-tag {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            color: var(--accent);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 5px;
            display: block;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 25px;
        }

        h1 span {
            color: var(--primary);
        }

        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .input-field {
            width: 100%;
            background: var(--bg-deep);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 18px 14px 45px;
            color: var(--text-main);
            border-radius: 12px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
            background: rgba(13, 17, 23, 0.9);
        }

        .btn-action {
            font-family: 'Orbitron', sans-serif;
            background: var(--primary);
            color: var(--bg-deep);
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .btn-action:hover {
            background: #7dd3fc;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.8);
            transform: translateY(-2px);
        }

        .btn-guest {
            font-family: 'Orbitron', sans-serif;
            background: transparent;
            color: var(--secondary);
            border: 1px solid var(--secondary);
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-guest:hover {
            background: var(--secondary);
            color: var(--bg-deep);
            box-shadow: 0 0 20px rgba(52, 211, 153, 0.5);
        }

        .status-msg {
            margin-top: 15px;
            font-size: 0.8rem;
            color: var(--secondary);
            font-family: 'Orbitron', sans-serif;
            min-height: 20px;
        }

        .login-footer {
            margin-top: 25px;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }

        @media (max-width: 480px) {
            .login-card { padding: 35px 20px; margin: 15px; }
        }
    </style>
</head>
<body>

    <div class="cyber-grid"></div>
    <div class="scanlines"></div>

    <div class="login-card">
        <div class="avatar-robot">
            <img src="aset/Pp Mabit.png" alt="Logo PKD">
        </div>
        <span class="system-tag">// SECURE GATEWAY v3.0</span>
        <h1>PKD <span>COMMAND AUTH</span></h1>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label for="username">NAMA LENGKAP / ID PENDAFTAR</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user-astronaut"></i>
                    <input type="text" id="username" class="input-field" placeholder="Ketik namamu di sini..." autocomplete="off" required onkeypress="playBeep()">
                </div>
            </div>

            <div class="input-group">
                <label for="password">KODE RAHASIA / PIN SELEKSI</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-shield-halved"></i>
                    <input type="password" id="password" class="input-field" placeholder="••••••••" required onkeypress="playBeep()">
                </div>
            </div>

            <button type="submit" class="btn-action" onclick="playClick()">
                <i class="fa-solid fa-terminal"></i> MASUK KE DASHBOARD
            </button>
        </form>

        <button class="btn-guest" onclick="enterAsGuest()">
            <i class="fa-solid fa-rocket"></i> MASUK SEBAGAI TAMU / KADER
        </button>

        <div class="status-msg" id="statusMsg"></div>

        <div class="login-footer">
            &copy; 2026 RANGGA ASH RAFFY JANNUARTA
        </div>
    </div>

    <script>
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playBeep() {
            try {
                initAudio();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(700, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.015, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch(e) {}
        }

        function playClick() {
            try {
                initAudio();
                let now = audioCtx.currentTime;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.setValueAtTime(950, now + 0.1);
                gain.gain.setValueAtTime(0.04, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            } catch(e) {}
        }

        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value;
            const statusBox = document.getElementById('statusMsg');

            statusBox.innerHTML = "MENGECEK SISTEM KADER... [VERIFIED]";
            
            setTimeout(() => {
                statusBox.innerHTML = `AKSES DITERIMA! Selamat datang, ${user.toUpperCase()} ✨`;
            }, 1000);

            setTimeout(() => {
                window.location.href = "Dashboard.html"; 
            }, 2000);
        }

        function enterAsGuest() {
            playClick();
            const statusBox = document.getElementById('statusMsg');
            statusBox.innerHTML = "MEMBUKA GERBANG UTAMA KEBAHAGIAAN... 🚀";
            
            setTimeout(() => {
                window.location.href = "index.html";
            }, 1500);
        }
    </script>
</body>
</html>
